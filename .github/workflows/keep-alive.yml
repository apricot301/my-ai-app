name: Keep Streamlit Alive

on:
  schedule:
    # 매일 한국시간 오전 9시에 자동 실행
    - cron: '0 0 * * *'
  # Actions 탭에서 수동으로 테스트해볼 수 있는 버튼
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Streamlit 앱 접속하기
        run: curl -L https://my-ai-app-upxcrvlnexwwqteyaeikk6.streamlit.app/

