name: Keep Streamlit Alive

on:
  schedule:
    # 매일 UTC 자정 (한국시간 오전 9시)에 1번씩 접속
    - cron: '0 0 * * *'
  # 수동으로 실행해볼 수 있는 버튼 생성
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Streamlit 앱 접속하기
        # 필수: 아래 주소를 본인의 실제 Streamlit 앱 주소로 꼭 변경하세요!
        run: curl -L https://apricot301-app.streamlit.app

